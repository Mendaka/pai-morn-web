<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Paimorn — browse, submit, and read song lyrics and chords.">

  <!-- Open Graph (Facebook, LINE, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Paimorn">
  <meta property="og:description" content="Browse, submit, and read song lyrics and chords.">
  <meta property="og:image" content="https://song-and-chord.web.app/site-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://song-and-chord.web.app/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Paimorn">
  <meta name="twitter:description" content="Browse, submit, and read song lyrics and chords.">
  <meta name="twitter:image" content="https://song-and-chord.web.app/site-card.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Paimorn">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Paimorn</title>
  <link rel="manifest" href="manifest.json">
  
</head>

<body>
  <!--
    Site-visit tracking (GA4) — separate from the Dart-side Firebase
    plugins that power the actual app (auth/Firestore). Previously this was
    pasted as the *inline body* of the `<script src="flutter_bootstrap.js">`
    tag below; a `<script>` tag with a `src` attribute always ignores its
    inline body, so that Firebase Analytics import/init code silently never
    ran — no visits were ever being counted. Using gtag.js directly here
    instead of the Firebase JS SDK module avoids needing an ES-module CDN
    import (this page has no bundler to resolve a bare `firebase/app`
    specifier), and is Google's own recommended snippet for a plain site.
  -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-65F29F45FH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-65F29F45FH');
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
